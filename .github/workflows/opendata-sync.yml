name: OpenData Sync

on:
  schedule:
    # 每週一 02:00 UTC (10:00 台北時間) 自動檢查法規開放資料更新
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run OpenData Sync Script
        run: node sync-opendata.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(opendata): auto-sync law data from moj [skip ci]" && git push)
